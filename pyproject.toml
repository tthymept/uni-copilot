[project]
name = "uni-copilot"
version = "0.1.0"
description = "Personal academic agent for NTU students: NTULearn deadlines, announcements and reminders via Claude Code and Telegram"
readme = "README.md"
authors = [
    { name = "Thyme", email = "203131150+tthymept@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=2.5.4",
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
    "tzdata>=2026.5",
]

[project.scripts]
uni-copilot = "uni_copilot.cli:main"
ntulearn-mcp = "uni_copilot.ntulearn_mcp.server:main"
pilot-mcp = "uni_copilot.pilot_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mcp[cli]>=2.3,<3",
    "pytest>=9.1.1",
]
