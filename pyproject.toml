[project]
name = "uni-copilot"
version = "0.1.0"
description = "Personal academic agent for NTU students: NTULearn deadlines, announcements and reminders via Claude Code and Telegram"
readme = "README.md"
authors = [
    { name = "Thyme", email = "203131150+tthymept@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.1",
    "requests>=2.34.2",
]

[project.scripts]
uni-copilot = "uni_copilot:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
